{% load static %}
<!-- ================= MAIN CONTAINER ================= -->
<div class="main-container">

    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">

        <div class="profile">
    <img
        src="{% if request.session.seller_image %}{{ request.session.seller_image }}{% else %}{% static 'adminsite/images/profile.png' %}{% endif %}"
        class="logo-img"
        alt="profile"
    >

    <p class="profile-username">
        {{ request.session.role|capfirst }}
    </p>

    <span class="role-badge {{ request.session.seller_role }}">
        {{ request.session.seller_role|upper }}
    </span>
</div>


        <div class="sidebar-menu">
            <h5 class="menu-heading">Overview</h5>
            <ul>
                <li data-title="Dashboard" class="menu-item">
                    <i class="fas fa-home"></i>
                    <a href="{% url 'admin_dashboard' %}">Dashboard</a>
                </li>
            </ul>

            <h5 class="menu-heading">Store Management</h5>
            <ul>
                <li data-title="Users" class="menu-item">
                    <i class="fas fa-users"></i>
                    <a href="{% url 'admin_users' %}">Users</a>
                </li>
                <li data-title="Sellers" class="menu-item">
                    <i class="fas fa-store"></i>
                    <a href="{% url 'admin_sellers' %}">Sellers</a>
                </li>
                <li data-title="Products" class="menu-item">
                    <i class="fas fa-box"></i>
                    <a href="{% url 'admin_products' %}">Products</a>
                </li>
                <li data-title="Orders" class="menu-item">
                    <i class="fas fa-shopping-cart"></i>
                    <a href="{% url 'admin_orders' %}">Orders</a>
                </li>
            </ul>

            <h5 class="menu-heading">Support</h5>
            <ul>
                <li data-title="Messages" class="menu-item">
                    <i class="fas fa-envelope"></i>
                    <a href="{% url 'admin_messages' %}">Messages</a>
                </li>
                <li class="menu-item logout-item" data-title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <a href="javascript:void(0)" onclick="logoutUser()">Logout</a>
                </li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <button id="sidebarToggleBtn" class="toggle-btn" aria-label="Toggle Sidebar">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>
           
    </aside>
