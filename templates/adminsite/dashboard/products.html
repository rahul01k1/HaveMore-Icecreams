{% extends "adminsite/base.html" %}
{% block title %}Products{% endblock %}

{% block content %}
<section class="dashboard" style="margin-left: 19vw;">

    <!-- PAGE HEADER -->
    <div class="page-header">
        <h1>Products Management</h1>
        <button class="btn-primary" onclick="toggleAddProduct()">+ Add Product</button>
    </div>

    {% csrf_token %}

    <!-- ADD PRODUCT MODAL -->
    <div class="modal-overlay" id="addProductCard" onclick="if(event.target === this) toggleAddProduct()">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Add New Product</h3>
                <button class="modal-close" onclick="toggleAddProduct()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="addProductForm" enctype="multipart/form-data">
                    <div class="form-grid">
                        <input type="text" name="product_name" class="search-pill"
                            style="width:100%; border-radius:8px;" placeholder="Product Name" required>
                        <input type="number" name="product_price" class="search-pill"
                            style="width:100%; border-radius:8px;" placeholder="Price" required>
                        <input type="number" name="product_stock" class="search-pill"
                            style="width:100%; border-radius:8px;" placeholder="Stock" required>

                        <select name="product_status" class="search-pill" style="width:100%; border-radius:8px;"
                            required>
                            <option value="active" selected>Active</option>
                            <option value="inactive">Inactive</option>
                        </select>

                        <select name="seller" class="search-pill" style="width:100%; border-radius:8px;" required>
                            <option value="">Select Seller</option>
                            {% for seller in sellers %}
                            <option value="{{ seller.id }}">{{ seller.seller_name }}</option>
                            {% endfor %}
                        </select>

                        <input type="file" name="product_image" style="padding:10px;" accept="image/*">
                    </div>

                    <div class="form-actions" style="margin-top:20px;">
                        <button type="submit" class="btn-primary">Save Product</button>
                        <button type="button" class="btn-secondary" onclick="toggleAddProduct()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- EDIT PRODUCT MODAL -->
    <div class="modal-overlay" id="editProductCard" onclick="if(event.target === this) closeEditProduct()">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Edit Product</h3>
                <button class="modal-close" onclick="closeEditProduct()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="editProductForm" enctype="multipart/form-data">
                    <input type="hidden" name="id" id="edit_id">

                    <div class="form-grid">
                        <input type="text" name="product_name" id="edit_name" class="search-pill"
                            style="width:100%; border-radius:8px;" required>
                        <input type="number" name="product_price" id="edit_price" class="search-pill"
                            style="width:100%; border-radius:8px;" required>
                        <input type="number" name="product_stock" id="edit_stock" class="search-pill"
                            style="width:100%; border-radius:8px;" required>

                        <select name="product_status" id="edit_status" class="search-pill"
                            style="width:100%; border-radius:8px;">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>

                        <input type="file" name="product_image" style="padding:10px;" accept="image/*">
                    </div>

                    <div class="form-actions" style="margin-top:20px;">
                        <button type="submit" class="btn-primary">Update Product</button>
                        <button type="button" class="btn-secondary" onclick="closeEditProduct()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- PRODUCTS TABLE -->
    <div class="filter-tabs" style="justify-content:space-between; align-items:center;">
        <div class="search-pill">
            <i class="fas fa-search"></i>
            <input type="text" id="productSearch" placeholder="Search Products..." oninput="filterProducts()">
        </div>
    </div>

    <div class="card">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Seller</th>
                    <th class="center">Actions</th>
                </tr>
            </thead>
            <tbody id="productsBody"></tbody>
        </table>

        <!-- PAGINATION -->
        <div class="pagination" id="paginationContainer"></div>
    </div>

</section>

<script>
    const csrfToken = "{{ csrf_token }}";

    let nextPageUrl = null;
    let prevPageUrl = null;
    let currentPage = 1;
    let pageSize = 10;

    let currentFetchedProducts = [];
    let searchQuery = "";

    /* TOGGLE ADD */
    function toggleAddProduct() {
        const el = document.getElementById("addProductCard");
        if (el.classList.contains("show")) el.classList.remove("show");
        else el.classList.add("show");
    }

    let debounceTimer;
    function filterProducts() {
        searchQuery = document.getElementById("productSearch").value.toLowerCase();
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            currentPage = 1;
            const url = searchQuery
                ? `/adminsite/api/products/?search=${encodeURIComponent(searchQuery)}`
                : `/adminsite/api/products/`;
            loadProducts(url);
        }, 300);
    }

    /* LOAD PRODUCTS WITH PAGINATION */
    function loadProducts(url = "/adminsite/api/products/") {
        fetch(url)
            .then(res => res.json())
            .then(data => {
                currentFetchedProducts = data.results || [];
                nextPageUrl = data.next;
                prevPageUrl = data.previous;

                const totalPages = Math.ceil(data.count / pageSize);
                renderTable(totalPages);
            });
    }

    function renderTable(totalPages = 1) {
        const body = document.getElementById("productsBody");
        body.innerHTML = "";

        let displayProducts = currentFetchedProducts;

        if (displayProducts.length === 0) {
            body.innerHTML = `<tr><td colspan="6" class="center">No products found.</td></tr>`;
        } else {
            displayProducts.forEach(p => {
                let badgeCls = p.product_status === "active" ? "badge-success" : "badge-danger";
                body.innerHTML += `
                <tr>
                    <td>
                        <div class="product-cell" style="display:flex; align-items:center; gap:12px;">
                            <img src="${p.product_image}" class="product-img" style="width:40px; height:40px; border-radius:8px; object-fit:cover;">
                            <div class="product-info">
                                <strong style="font-size:14px; color:#334155;">${p.product_name}</strong>
                            </div>
                        </div>
                    </td>
                    <td><strong>₹${p.product_price}</strong></td>
                    <td>${p.product_stock}</td>
                    <td>
                        <span class="badge ${badgeCls}">
                            ${p.product_status.toUpperCase()}
                        </span>
                    </td>
                    <td style="color:#64748b;">${p.seller_name || "-"}</td>
                    <td class="center" style="white-space:nowrap;">
                        <button class="btn-secondary" onclick="openEditProduct(${p.id}, '${p.product_name.replace(/'/g, "\\'")}', ${p.product_price}, ${p.product_stock}, '${p.product_status}')" title="Edit"><i class="fas fa-edit"></i></button>
                        <button class="btn-danger" onclick="deleteProduct(${p.id})" title="Delete"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
            });
        }

        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        const container = document.getElementById("paginationContainer");
        let html = "";

        if (prevPageUrl) {
            html += `<button class="btn" onclick="loadPrev()">Prev</button>`;
        } else {
            html += `<button class="btn disabled">Prev</button>`;
        }

        html += `<span class="page-num active">${currentPage}</span>`;

        if (nextPageUrl) {
            html += `<button class="btn" onclick="loadNext()">Next</button>`;
        } else {
            html += `<button class="btn disabled">Next</button>`;
        }

        container.innerHTML = html;
    }

    /* PAGINATION */
    function loadNext() {
        if (nextPageUrl) {
            currentPage++;
            loadProducts(nextPageUrl);
        }
    }

    function loadPrev() {
        if (prevPageUrl) {
            currentPage--;
            loadProducts(prevPageUrl);
        }
    }

    /* CREATE */
    document.getElementById("addProductForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const formData = new FormData(this);

        fetch("/adminsite/api/products/", {
            method: "POST",
            headers: { "X-CSRFToken": csrfToken },
            body: formData
        }).then(() => {
            toggleAddProduct();
            currentPage = 1;
            loadProducts();
            this.reset();
        });
    });

    /* EDIT */
    function openEditProduct(id, name, price, stock, status) {
        document.getElementById("edit_id").value = id;
        document.getElementById("edit_name").value = name;
        document.getElementById("edit_price").value = price;
        document.getElementById("edit_stock").value = stock;
        document.getElementById("edit_status").value = status;
        document.getElementById("editProductCard").classList.add("show");
    }

    function closeEditProduct() {
        document.getElementById("editProductCard").classList.remove("show");
    }

    /* UPDATE */
    document.getElementById("editProductForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const id = document.getElementById("edit_id").value;
        const formData = new FormData(this);

        fetch(`/adminsite/api/products/${id}/`, {
            method: "PATCH",
            headers: { "X-CSRFToken": csrfToken },
            body: formData
        })
            .then(res => res.json())
            .then(() => {
                closeEditProduct();
                currentPage = 1;
                loadProducts();
            });
    });

    /* DELETE */
    function deleteProduct(id) {
        if (!confirm("Delete this product?")) return;

        fetch(`/adminsite/api/products/${id}/`, {
            method: "DELETE",
            headers: { "X-CSRFToken": csrfToken }
        }).then(() => loadProducts());
    }

    /* INITIAL LOAD */
    loadProducts();
</script>

{% endblock %}
