{% extends "adminsite/base.html" %}
{% block title %}Orders{% endblock %}

{% block content %}
<section class="dashboard" style="margin-left: 19vw;">

<!-- PAGE HEADER -->
<div class="page-header">
    <h1>Order Management</h1>
</div>

{% csrf_token %}

<!-- ================= VIEW ORDER ITEMS MODAL ================= -->
<div class="modal-overlay" id="itemsCard" onclick="if(event.target === this) closeItems()">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Order Items</h3>
            <button class="modal-close" onclick="closeItems()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="itemsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- ================= EDIT ORDER MODAL ================= -->
<div class="modal-overlay" id="editOrderCard" onclick="if(event.target === this) closeEditOrder()">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Update Order</h3>
            <button class="modal-close" onclick="closeEditOrder()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="edit_id">
            <div class="form-grid">
                <select id="edit_status" class="search-pill" style="width:100%; margin-bottom:12px;">
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>

                <select id="edit_payment_status" class="search-pill" style="width:100%;">
                    <option value="pending">Pending</option>
                    <option value="paid">Paid</option>
                    <option value="failed">Failed</option>
                </select>
            </div>
            <div class="form-actions" style="margin-top:24px;">
                <button class="btn-primary" onclick="updateOrder()">Update Order</button>
                <button class="btn-secondary" onclick="closeEditOrder()">Cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- ================= ORDERS TABLE ================= -->
<div class="filter-tabs">
    <button class="filter-tab active" onclick="setFilter('all')">All Orders</button>
    <button class="filter-tab" onclick="setFilter('pending')">Pending</button>
    <button class="filter-tab" onclick="setFilter('delivered')">Delivered</button>
    <button class="filter-tab" onclick="setFilter('cancelled')">Cancelled</button>
</div>

<div class="card">

    <table class="data-table">
        <thead>
            <tr>
                <th>#ID</th>
                <th>User</th>
                <th>Contact</th>
                <th>Address</th>
                <th>Status</th>
                <th>Payment</th>
                <th>Date</th>
                <th class="center">Actions</th>
            </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
    </table>

    <!-- PAGINATION -->
    <div class="pagination" id="paginationContainer"></div>
</div>

</section>

<script>
const csrfToken = "{{ csrf_token }}";

let nextPageUrl = null;
let prevPageUrl = null;
let currentPage = 1;

let currentFetchedOrders = [];
let currentFilter = 'all';

function setFilter(status) {
    currentFilter = status;
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.classList.remove('active');
        if (tab.innerText.toLowerCase().includes(status.toLowerCase())) {
            tab.classList.add('active');
        }
    });
    renderOrders();
}

/* ================= LOAD ORDERS ================= */
function loadOrders(url = "/adminsite/api/orders/") {
    fetch(url)
        .then(res => res.json())
        .then(data => {
            currentFetchedOrders = data.results || [];
            nextPageUrl = data.next;
            prevPageUrl = data.previous;
            renderOrders();
        });
}

function renderOrders() {
    const body = document.getElementById("ordersBody");
    body.innerHTML = "";
    
    let filteredOrders = currentFetchedOrders;
    if (currentFilter !== 'all') {
        filteredOrders = currentFetchedOrders.filter(o => o.status === currentFilter);
    }

    if (!filteredOrders.length) {
        body.innerHTML = `
            <tr>
                <td colspan="8" class="center">No orders found matching filter</td>
            </tr>
        `;
    } else {
        filteredOrders.forEach(o => {
            let statusBadge = "badge-warning";
            if (o.status === "delivered") statusBadge = "badge-success";
            if (o.status === "cancelled") statusBadge = "badge-danger";

            body.innerHTML += `
                <tr>
                    <td><strong>#${o.id}</strong></td>
                    <td>
                        <strong style="color:#334155;">${o.user_name}</strong>
                    </td>
                    <td>
                        <div style="font-size:13px; line-height:1.4;">
                            <strong>${o.name}</strong><br>
                            <span style="color:#64748b;">${o.email}</span><br>
                            <span style="color:#64748b;">${o.number}</span>
                        </div>
                    </td>
                    <td>
                        <div style="font-size:13px; line-height:1.4; max-width:200px;">
                            ${o.address}<br>
                            <small style="color:#94a3b8; font-weight:600;">(${o.address_type.toUpperCase()})</small>
                        </div>
                    </td>
                    <td><span class="badge ${statusBadge}">${o.status.toUpperCase()}</span></td>
                    <td>
                        <span class="badge ${o.payment_status === 'paid' ? 'badge-success' : 'badge-danger'}">
                            ${o.payment_status.toUpperCase()}
                        </span>
                    </td>
                    <td style="font-size:13px; white-space:nowrap;">${o.date}</td>
                    <td class="center" style="white-space:nowrap;">
                        <button class="btn-secondary" onclick='viewItems(${o.id}, ${JSON.stringify(o.items).replace(/'/g, "\\'")})' title="View Items"><i class="fas fa-eye"></i></button>
                        <button class="btn-primary" onclick="openEditOrder(${o.id}, '${o.status}', '${o.payment_status}')" title="Update"><i class="fas fa-edit"></i></button>
                    </td>
                </tr>
            `;
        });
    }

    renderPagination();
}

/* ================= PAGINATION RENDER ================= */
function renderPagination() {
    const container = document.getElementById("paginationContainer");
    let html = "";
    
    if (prevPageUrl) {
        html += `<button class="btn" onclick="loadPrev()">Prev</button>`;
    } else {
        html += `<button class="btn disabled">Prev</button>`;
    }
    
    html += `<span class="page-num active">${currentPage}</span>`;
    
    if (nextPageUrl) {
        html += `<button class="btn" onclick="loadNext()">Next</button>`;
    } else {
        html += `<button class="btn disabled">Next</button>`;
    }
    
    container.innerHTML = html;
}

/* ================= VIEW ITEMS ================= */
function viewItems(orderId, items) {
    const body = document.getElementById("itemsBody");
    body.innerHTML = "";

    items.forEach(i => {
        body.innerHTML += `
            <tr>
                <td>${i.product_name}</td>
                <td>₹${i.price}</td>
                <td>${i.qty}</td>
                <td>₹${i.price * i.qty}</td>
            </tr>
        `;
    });

    document.getElementById("itemsCard").classList.add("show");
}

function closeItems() {
    document.getElementById("itemsCard").classList.remove("show");
}

/* ================= EDIT ORDER ================= */
function openEditOrder(id, status, paymentStatus) {
    document.getElementById("edit_id").value = id;
    document.getElementById("edit_status").value = status;
    document.getElementById("edit_payment_status").value = paymentStatus;

    document.getElementById("editOrderCard").classList.add("show");
}

function closeEditOrder() {
    document.getElementById("editOrderCard").classList.remove("show");
}

/* ================= UPDATE ORDER ================= */
function updateOrder() {
    const id = document.getElementById("edit_id").value;

    fetch(`/adminsite/api/orders/${id}/`, {
        method: "PATCH",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        body: JSON.stringify({
            status: document.getElementById("edit_status").value,
            payment_status: document.getElementById("edit_payment_status").value
        })
    }).then(() => {
        closeEditOrder();
        loadOrders(nextPageUrl || prevPageUrl || "/adminsite/api/orders/");
    });
}

/* ================= PAGINATION ================= */
function loadNext() {
    if (nextPageUrl) {
        currentPage++;
        loadOrders(nextPageUrl);
    }
}
function loadPrev() {
    if (prevPageUrl) {
        currentPage--;
        loadOrders(prevPageUrl);
    }
}

/* INITIAL LOAD */
loadOrders();
</script>

{% endblock %}
