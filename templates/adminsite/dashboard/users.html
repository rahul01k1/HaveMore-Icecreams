{% extends "adminsite/base.html" %}
{% block title %}Users{% endblock %}

{% block content %}

<section class="dashboard" style="margin-left: 19vw;">

<!-- PAGE HEADER -->
<div class="page-header">
    <h1>Users Management</h1>
    <button class="btn-primary" onclick="toggleAddUser()">+ Add User</button>
</div>

{% csrf_token %}

<!-- ADD USER CARD -->
<div class="card" id="addUserCard" style="display:none;">
    <h3>Add New User</h3>

    <div class="form-grid">
        <input type="text" id="name" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">

        <select id="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>
    </div>

    <div class="form-actions">
        <button class="btn-primary" onclick="addUser()">Save</button>
        <button class="btn-secondary" onclick="toggleAddUser()">Cancel</button>
    </div>
</div>

<!-- EDIT USER CARD -->
<div class="card" id="editUserCard" style="display:none;">
    <h3>Edit User</h3>

    <input type="hidden" id="edit_id">

    <div class="form-grid">
        <input type="text" id="edit_name" placeholder="Full Name">
        <input type="email" id="edit_email" placeholder="Email Address">

        <select id="edit_role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>
    </div>

    <div class="form-actions">
        <button class="btn-primary" onclick="updateUser()">Update</button>
        <button class="btn-secondary" onclick="closeEditUser()">Cancel</button>
    </div>
</div>

<!-- USERS TABLE -->
<div class="card">
    <table class="data-table">
        <thead>
            <tr>
                <th>User</th>
                <th>Email</th>
                <th>Role</th>
                <th class="center">Actions</th>
            </tr>
        </thead>
        <tbody id="usersBody"></tbody>
    </table>
    
    <!-- PAGINATION -->
    <div class="pagination" id="paginationContainer"></div>
</div>

</section>

<script>
const csrfToken = "{{ csrf_token }}";

/* ---------------- TOGGLE ADD USER ---------------- */

function toggleAddUser() {
    const card = document.getElementById("addUserCard");
    card.style.display = card.style.display === "none" ? "block" : "none";
}

/* ---------------- LOAD USERS ---------------- */
let allUsers = [];
let currentPage = 1;
const itemsPerPage = 10;

function loadUsers() {
    fetch("/adminsite/api/users/")
        .then(res => res.json())
        .then(data => {
            allUsers = data.results || data;
            currentPage = 1;
            renderTable();
        })
        .catch(err => console.error("Load users error:", err));
}

function renderTable() {
    const body = document.getElementById("usersBody");
    body.innerHTML = "";

    if (!allUsers || allUsers.length === 0) {
        body.innerHTML = `<tr><td colspan="4" class="center">No users found</td></tr>`;
        document.getElementById("paginationContainer").innerHTML = "";
        return;
    }

    const totalPages = Math.ceil(allUsers.length / itemsPerPage);
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const paginatedUsers = allUsers.slice(start, end);

    paginatedUsers.forEach(u => {
        body.innerHTML += `
            <tr>
                <td>
                    <div class="product-cell" style="display:flex; align-items:center; gap:12px;">
                        <img src="${u.user_image || '/static/home/image/user.jpg'}" class="product-img" style="width:40px; height:40px; border-radius:50%; object-fit:cover;" alt="User">
                        <div class="product-info">
                            <strong style="font-size:14px; color:#334155;">${u.user_name}</strong>
                        </div>
                    </div>
                </td>
                <td>${u.user_email}</td>
                <td><span class="badge ${u.role === 'admin' ? 'badge-danger' : 'badge-success'}">${u.role.toUpperCase()}</span></td>
                <td class="center">
                    <button class="btn-secondary" onclick="openEditUser(${u.id}, '${u.user_name}', '${u.user_email}', '${u.role}')"><i class="fas fa-edit"></i> Edit</button>
                    <button class="btn-danger" onclick="deleteUser(${u.id})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `;
    });
    
    renderPagination(totalPages);
}

function renderPagination(totalPages) {
    const container = document.getElementById("paginationContainer");
    let html = "";
    
    if (totalPages > 1) {
        html += `<button class="btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(1)">First</button>`;
        html += `<button class="btn ${currentPage === 1 ? 'disabled' : ''}" onclick="goToPage(${currentPage - 1})">Prev</button>`;
        
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, currentPage + 2);
        
        for (let i = startPage; i <= endPage; i++) {
            html += `<span class="page-num ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</span>`;
        }
        
        html += `<button class="btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${currentPage + 1})">Next</button>`;
        html += `<button class="btn ${currentPage === totalPages ? 'disabled' : ''}" onclick="goToPage(${totalPages})">Last</button>`;
    }
    
    container.innerHTML = html;
}

function goToPage(page) {
    const totalPages = Math.ceil(allUsers.length / itemsPerPage);
    if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderTable();
    }
}

/* ---------------- CREATE USER ---------------- */

function addUser() {
    fetch("/adminsite/api/users/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        body: JSON.stringify({
            user_name: document.getElementById("name").value,
            user_email: document.getElementById("email").value,
            user_password: document.getElementById("password").value,
            role: document.getElementById("role").value
        })
    }).then(() => {
        toggleAddUser();
        loadUsers();
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
    });
}

/* ---------------- EDIT USER ---------------- */

function openEditUser(id, name, email, role) {
    document.getElementById("edit_id").value = id;
    document.getElementById("edit_name").value = name;
    document.getElementById("edit_email").value = email;
    document.getElementById("edit_role").value = role;

    document.getElementById("addUserCard").style.display = "none";
    document.getElementById("editUserCard").style.display = "block";

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function closeEditUser() {
    document.getElementById("editUserCard").style.display = "none";
}

/* ---------------- UPDATE USER ---------------- */

function updateUser() {
    const id = document.getElementById("edit_id").value;

    fetch(`/adminsite/api/users/${id}/`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        body: JSON.stringify({
            user_name: document.getElementById("edit_name").value,
            user_email: document.getElementById("edit_email").value,
            role: document.getElementById("edit_role").value
        })
    }).then(() => {
        closeEditUser();
        loadUsers();
    });
}

/* ---------------- DELETE USER ---------------- */

function deleteUser(id) {
    if (!confirm("Are you sure you want to delete this user?")) return;

    fetch(`/adminsite/api/users/${id}/`, {
        method: "DELETE",
        headers: {
            "X-CSRFToken": csrfToken
        }
    }).then(loadUsers);
}

/* INITIAL LOAD */
loadUsers();
</script>

{% endblock %}
